/* ---- rekap & tunggakan jimpitan ---- */
function wibToday() { return new Date(Date.now() + 7*3600*1000).toISOString().slice(0,10); }
function bulanLabel(b) {
  const [y, m] = String(b).split("-").map(Number);
  return ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"][m-1] + " " + y;
}
let rekapJ = { bulan: wibToday().slice(0,7), data: null, detail: null, detailId: "", onlyTunggak: false };
async function refreshRekapJimpitan() {
  const r = await apiGet("getRekapJimpitan", { bulan: rekapJ.bulan });
  if (!r.ok) throw new Error(r.error);
  rekapJ.data = r;
}
let rekapH = { tanggal: wibToday(), data: null, filter: "semua" };
const BLN_PENDEK = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
function tglPendekApp(ymd) { const m = String(ymd || "").match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? (parseInt(m[3],10) + " " + BLN_PENDEK[parseInt(m[2],10)-1]) : (ymd || "-"); }
function hariLabel(ymd) {
  const m = String(ymd).match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return ymd;
  const nm = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"][new Date(Date.UTC(+m[1], +m[2]-1, +m[3])).getUTCDay()];
  return nm + ", " + parseInt(m[3],10) + " " + bulanLabel(m[1] + "-" + m[2]);
}
async function refreshRekapHarian() {
  const r = await apiGet("getRekapHarianJimpitan", { tanggal: rekapH.tanggal });
  if (!r.ok) throw new Error(r.error);
  rekapH.data = r;
}
function csvRekapHarian() {
  const d = rekapH.data; if (!d) return;
  const rows = [["tanggal","rumah","petugas","jam","setoran","pelunasan","total_diambil","status"]];
  d.rumah.forEach(o => { if (o.dicatat) rows.push([d.tanggal, o.nama, o.petugas.join(" / "), o.jam, o.setor, o.pelunasan, o.diambil, o.status]); });
  downloadCSV("jimpitan-harian-" + d.tanggal + ".csv", rows);
}
async function refreshRekapDetail() {
  const r = await apiGet("getDetailJimpitanRumah", { id_rumah: rekapJ.detailId, bulan: rekapJ.bulan });
  if (!r.ok) throw new Error(r.error);
  rekapJ.detail = r;
}
function rekapRow(id) {
  if (rekapJ.detail && rekapJ.detail.ringkasan.id === id) return rekapJ.detail.ringkasan;
  return rekapJ.data && rekapJ.data.rumah.find(o => o.id === id);
}
function csvCell(v) { v = String(v == null ? "" : v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function downloadCSV(name, rows) {
  const csv = "\uFEFF" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function shareWa(text) { window.open(waLink(text), "_blank"); }
function csvRekapBulan() {
  const d = rekapJ.data;
  const rows = [["rumah","status","hari_wajib","hari_setor","hari_lunas","total_setor","target_bulan","kurang_bulan_ini","tunggakan_bulan_sebelumnya","total_tunggakan"]];
  d.rumah.forEach(o => rows.push([o.nama, o.status_jimpitan, o.hari_wajib, o.hari_setor, o.hari_lunas, o.setor, o.target, o.kurang_bulan, o.tunggakan_lalu, o.total_tunggakan]));
  downloadCSV("rekap-jimpitan-" + rekapJ.bulan + ".csv", rows);
}
function waRekapBulan() {
  const d = rekapJ.data, s = d.ringkasan;
  const men = d.rumah.filter(o => o.total_tunggakan > 0);
  let t = `*Rekap Jimpitan ${bulanLabel(rekapJ.bulan)}*\nRT 11 Dukuh Tulusari\n(dihitung s/d ${fmtTanggal(d.dihitung_sampai)})\n\nTerkumpul: ${rupiah(s.terkumpul)}\nTotal tunggakan: ${rupiah(s.tunggakan)} (${s.rumah_menunggak} rumah)\n`;
  if (men.length) { t += "\nRumah yang menunggak:\n"; men.forEach((o, i) => { t += `${i+1}. ${o.nama} — ${rupiah(o.total_tunggakan)} (${o.hari_tunggak} hari)\n`; }); }
  else t += "\nSemua rumah lunas. Terima kasih 🙏";
  shareWa(t);
}
function waRumah(id) {
  const o = rekapRow(id); if (!o) return;
  shareWa(`Assalamualaikum, pengingat jimpitan RT 11 Dukuh Tulusari.\nRumah: ${o.nama}\nTunggakan s/d ${bulanLabel(rekapJ.bulan)}: ${rupiah(o.total_tunggakan)} (${o.hari_tunggak} hari x Rp500).\nMohon dilunasi lewat petugas/Bendahara Karang Taruna. Terima kasih 🙏`);
}
function csvDetailRumah() {
  const dt = rekapJ.detail, o = dt.ringkasan;
  const rows = [["rumah","tanggal","setor","status"]];
  dt.hari.forEach(h => rows.push([o.nama, h.tanggal, h.paid, h.status]));
  downloadCSV("jimpitan-" + o.nama.replace(/[^\w]+/g, "-") + "-" + rekapJ.bulan + ".csv", rows);
}
async function lunasiJimpitan(id) {
  const o = rekapRow(id); if (!o) return;
  const v = prompt(`${o.nama} menunggak ${o.hari_tunggak} hari (${rupiah(o.total_tunggakan)}) s/d ${bulanLabel(rekapJ.bulan)}.\nDilunasi mulai hari terlama. Berapa hari yang dilunasi? (1–${o.hari_tunggak})`, String(o.hari_tunggak));
  if (v === null) return;
  const n = parseInt(v, 10);
  if (!n || n < 1 || n > o.hari_tunggak) { alert("Jumlah hari tidak valid."); return; }
  const r = await apiPost("bayarJimpitan", { id_rumah: id, bulan: rekapJ.bulan, jumlah_hari: n });
  if (!r.ok) { alert(r.error); return; }
  alert(r.message);
  await loadAndShow(currentTab);
}
function bindRekapJimpitan() {
  const q = sel => document.querySelector(sel);
  const qa = sel => Array.from(document.querySelectorAll(sel));
  qa("[data-rekap-geser]").forEach(b => b.addEventListener("click", () => {
    const [y, m] = rekapJ.bulan.split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1 + Number(b.dataset.rekapGeser), 1));
    rekapJ.bulan = dt.toISOString().slice(0, 7); loadAndShow("rekapjimpitan");
  }));
  q("#rekapBulan") && q("#rekapBulan").addEventListener("change", e => { if (e.target.value) { rekapJ.bulan = e.target.value; loadAndShow("rekapjimpitan"); } });
  q("#rekapOnlyTunggak") && q("#rekapOnlyTunggak").addEventListener("change", e => { rekapJ.onlyTunggak = e.target.checked; setScreen(screens.rekapjimpitan()); attachEvents(); });
  q("#btnRekapCsv") && q("#btnRekapCsv").addEventListener("click", csvRekapBulan);
  q("#btnRekapHarian") && q("#btnRekapHarian").addEventListener("click", () => { rekapH.tanggal = wibToday(); goTab("rekapharian"); });
  qa("[data-harian-geser]").forEach(b => b.addEventListener("click", () => {
    const [y, m, dd] = rekapH.tanggal.split("-").map(Number);
    rekapH.tanggal = new Date(Date.UTC(y, m - 1, dd + Number(b.dataset.harianGeser))).toISOString().slice(0, 10); loadAndShow("rekapharian");
  }));
  q("#rekapHariTgl") && q("#rekapHariTgl").addEventListener("change", e => { if (e.target.value) { rekapH.tanggal = e.target.value; loadAndShow("rekapharian"); } });
  qa("[data-harian-filter]").forEach(b => b.addEventListener("click", () => { rekapH.filter = b.dataset.harianFilter; setScreen(screens.rekapharian()); attachEvents(); }));
  q("#btnHarianCsv") && q("#btnHarianCsv").addEventListener("click", csvRekapHarian);
  q("#btnRekapWa") && q("#btnRekapWa").addEventListener("click", waRekapBulan);
  q("#btnDetailCsv") && q("#btnDetailCsv").addEventListener("click", csvDetailRumah);
  qa("[data-rekap-detail]").forEach(b => b.addEventListener("click", () => { rekapJ.detailId = b.dataset.rekapDetail; goTab("rekapjimpitanDetail"); }));
  qa("[data-lunasi-jimpitan]").forEach(b => b.addEventListener("click", () => lunasiJimpitan(b.dataset.lunasiJimpitan)));
  qa("[data-wa-rumah]").forEach(b => b.addEventListener("click", () => waRumah(b.dataset.waRumah)));
  q("#btnSimpanMulai") && q("#btnSimpanMulai").addEventListener("click", async () => {
    const tanggal = q("#rekapMulai").value;
    if (!tanggal) { alert("Pilih tanggal mulai."); return; }
    if (!confirm("Ubah tanggal mulai tunggakan jimpitan ke " + fmtTanggal(tanggal) + "? Semua rekap dihitung ulang.")) return;
    const r = await apiPost("setJimpitanMulai", { tanggal });
    if (!r.ok) { alert(r.error); return; }
    alert(r.message); loadAndShow("rekapjimpitan");
  });
}

/* ====================== POSTING PER HARI & PETUGAS ====================== */
let pstData = null;
const PST_BLN = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
function pstTgl(ymd) { const m = String(ymd || "").match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? (parseInt(m[3],10) + " " + PST_BLN[parseInt(m[2],10)-1]) : (ymd || "-"); }
function pstHariLabel(ymd) {
  const m = String(ymd || "").match(/^(\d{4})-(\d{2})-(\d{2})/); if (!m) return ymd;
  return ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"][new Date(Date.UTC(+m[1], +m[2]-1, +m[3])).getUTCDay()] + ", " + pstTgl(ymd);
}
async function pstLoad() {
  try { const r = await apiGet("getPostingJimpitan"); pstData = (r && r.ok) ? r : null; } catch (e) { pstData = null; }
}
function pstBadge(pt) {
  if (pt.diterima === null) return '<span class="item-sub">Belum dicek</span>';
  if (pt.selisih === 0) return '<span class="badge ok">Cocok ✓</span>';
  return '<span style="font-weight:700;color:var(--brick)">Selisih ' + (pt.selisih > 0 ? '+' : '-') + rupiah(Math.abs(pt.selisih)) + '</span>';
}
function pstHtml(cfg) {
  if (!pstData) return "";
  if (!pstData.hari.length) return '<div class="card"><div class="empty">Tidak ada log yang menunggu posting.</div></div>';
  const chk = cfg.checked ? "checked" : "";
  return pstData.hari.map(d => `
    <div class="card" style="margin-top:12px">
      <div class="row">
        <label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" class="pst-hari" data-tgl="${esc(d.tanggal)}" ${chk}><b>${esc(pstHariLabel(d.tanggal))}</b></label>
        <span style="font-weight:700">${rupiah(d.total_belum)}</span>
      </div>
      <div class="item-sub">${d.jumlah_log} log · ${d.petugas.length} petugas</div>
      ${d.petugas.map(pt => `
        <div class="item" style="margin-top:8px">
          <div class="row">
            <label style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" class="pst-ptg" data-tgl="${esc(d.tanggal)}" data-ptg="${esc(pt.username || '-')}" ${chk}><span class="item-title">${esc(pt.nama)}</span><span class="item-sub">· ${pt.rumah} rumah</span></label>
            <span style="font-weight:700">${rupiah(pt.total_belum)}</span>
          </div>
          <div class="pst-cek" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0 4px 26px">
            <span class="item-sub">Sistem mencatat ${rupiah(pt.total_dicatat)}${pt.total_dicatat !== pt.total_belum ? ' (termasuk yang sudah diposting)' : ''}</span>
            ${cfg.canCatat
              ? `<input type="number" min="0" class="pst-in" placeholder="Uang diterima" value="${pt.diterima === null ? '' : pt.diterima}" style="width:130px;padding:6px 8px"><button class="btn outline sm" data-pst-simpan data-tgl="${esc(d.tanggal)}" data-ptg="${esc(pt.username || '-')}">Simpan</button>`
              : (pt.diterima !== null ? `<span class="item-sub">Diterima ${rupiah(pt.diterima)}</span>` : '')}
            ${pstBadge(pt)}
          </div>
          <details style="margin-left:26px"><summary class="item-sub" style="cursor:pointer">Lihat ${pt.logs.length} rumah</summary>
            ${pt.logs.map(l => `
              <div class="row" style="padding:6px 0;border-top:1px solid var(--line,#eee);align-items:flex-start">
                <label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer"><input type="checkbox" class="${cfg.logClass} pst-log" value="${esc(l.id)}" data-tgl="${esc(d.tanggal)}" data-ptg="${esc(pt.username || '-')}" data-jml="${Number(l.jumlah) || 0}" ${chk}>
                  <span>${esc(l.nama_rumah)}${l.jam ? ` <span class="item-sub">${esc(l.jam)}</span>` : ''}
                    ${l.jenis === 'pelunasan' ? `<div class="item-sub" style="color:var(--green)">pelunasan untuk ${esc(pstTgl(l.untuk_tanggal))}</div>` : (l.catatan ? `<div class="item-sub">${esc(l.catatan)}</div>` : '')}</span></label>
                <span style="text-align:right"><b>${rupiah(l.jumlah)}</b><br><button class="btn brick sm" ${cfg.delAttr}="${esc(l.id)}">Hapus</button></span>
              </div>`).join('')}
          </details>
        </div>`).join('')}
    </div>`).join('');
}
function pstTotalBarHtml() {
  return '<div class="card" style="margin-top:8px"><div class="row"><span class="label">Terpilih untuk diposting</span><span id="pstTotalTerpilih" style="font-weight:700">Rp 0</span></div></div>';
}
function pstSyncGroups() {
  const logs = Array.from(document.querySelectorAll(".pst-log"));
  document.querySelectorAll(".pst-ptg").forEach(g => { const l = logs.filter(x => x.dataset.tgl === g.dataset.tgl && x.dataset.ptg === g.dataset.ptg); g.checked = l.length > 0 && l.every(x => x.checked); });
  document.querySelectorAll(".pst-hari").forEach(g => { const l = logs.filter(x => x.dataset.tgl === g.dataset.tgl); g.checked = l.length > 0 && l.every(x => x.checked); });
}
function pstUpdTotal() {
  const el = document.getElementById("pstTotalTerpilih"); if (!el) return;
  const on = Array.from(document.querySelectorAll(".pst-log:checked"));
  el.textContent = rupiah(on.reduce((a, x) => a + (Number(x.dataset.jml) || 0), 0)) + " (" + on.length + " log)";
}
function pstRestore(keep) {
  document.querySelectorAll(".pst-log").forEach(x => { x.checked = keep.has(x.value); });
  pstSyncGroups(); pstUpdTotal();
}
async function pstSimpan(btn, cfg) {
  const box = btn.closest(".pst-cek"); const val = box.querySelector(".pst-in").value.trim();
  if (val !== "" && (isNaN(Number(val)) || Number(val) < 0)) { alert("Isi angka 0 atau lebih."); return; }
  btn.disabled = true; btn.textContent = "…";
  try {
    const r = await apiPost("setSetoranDiterima", { tanggal: btn.dataset.tgl, petugas: btn.dataset.ptg, diterima: val });
    if (!r.ok) { alert(r.error); btn.disabled = false; btn.textContent = "Simpan"; return; }
  } catch (e) { alert("Gagal menyimpan: " + e.message); btn.disabled = false; btn.textContent = "Simpan"; return; }
  const keep = new Set(Array.from(document.querySelectorAll(".pst-log:checked")).map(x => x.value));
  await cfg.reload(keep);
}
function pstBind(cfg) {
  const qa = s => Array.from(document.querySelectorAll(s));
  const logs = () => qa(".pst-log");
  qa(".pst-hari").forEach(cb => cb.addEventListener("change", () => {
    logs().filter(x => x.dataset.tgl === cb.dataset.tgl).forEach(x => { x.checked = cb.checked; });
    pstSyncGroups(); pstUpdTotal();
  }));
  qa(".pst-ptg").forEach(cb => cb.addEventListener("change", () => {
    logs().filter(x => x.dataset.tgl === cb.dataset.tgl && x.dataset.ptg === cb.dataset.ptg).forEach(x => { x.checked = cb.checked; });
    pstSyncGroups(); pstUpdTotal();
  }));
  logs().forEach(cb => cb.addEventListener("change", () => { pstSyncGroups(); pstUpdTotal(); }));
  qa("[data-pst-simpan]").forEach(b => b.addEventListener("click", () => pstSimpan(b, cfg)));
  pstSyncGroups(); pstUpdTotal();
}

function pstCfg() {
  return { logClass: "jimpitan-check", delAttr: "data-del-jimpitan", checked: false, canCatat: can.postJimpitan(),
    reload: async keep => { await pstLoad(); setScreen(screens.jimpitan()); attachEvents(); pstRestore(keep); } };
}

/* ---- jimpitan ---- */
async function submitJimpitan() {
  const btn = document.getElementById("btnSimpanJimpitan");
  const tanggal = document.getElementById("fTanggal").value;
  const jumlah = document.getElementById("fJumlah").value;
  const catatan = document.getElementById("fCatatan").value.trim();
  if (!tanggal) { formError = "Tanggal wajib diisi."; setScreen(jimpitanForm()); attachEvents(); return; }
  const selVal = document.getElementById("fRumahPilih").value;
  if (!selVal) { formError = "Rumah wajib dipilih."; setScreen(jimpitanForm()); attachEvents(); return; }
  const rr = await resolveRumahFromForm();
  if (!rr.ok) { formError = rr.error; setScreen(jimpitanForm()); attachEvents(); return; }
  if (!rr.id_rumah) { formError = "Rumah wajib dipilih."; setScreen(jimpitanForm()); attachEvents(); return; }
  const payload = { tanggal, id_rumah: rr.id_rumah, jumlah, catatan };
  btn.disabled = true; btn.textContent = "Menyimpan…";
  const r = await apiPost("addJimpitanLog", payload);
  if (!r.ok) { formError = r.error; setScreen(jimpitanForm()); attachEvents(); return; }
  formError = "";
  currentTab = "jimpitan";
  await refreshJimpitanLog(); setScreen(screens.jimpitan()); attachEvents();
}
async function delJimpitan(id) {
  if (!confirm("Hapus log jimpitan ini?")) return;
  const r = await apiPost("deleteJimpitanLog", { id });
  if (!r.ok) { alert(r.error); return; }
  await refreshJimpitanLog(); setScreen(screens.jimpitan()); attachEvents();
}
async function postingJimpitan() {
  const ids = Array.from(document.querySelectorAll(".jimpitan-check:checked")).map(c => c.value);
  if (!ids.length) { alert("Pilih minimal satu log jimpitan untuk diposting."); return; }
  if (!confirm("Posting " + ids.length + " log terpilih sebagai 1 mutasi masuk ke Kas Jimpitan? Setelah diposting, log ini tidak bisa diubah/dihapus lagi.")) return;
  const r = await apiPost("postJimpitanLog", { ids });
  if (!r.ok) { alert(r.error); return; }
  await refreshJimpitanLog(); setScreen(screens.jimpitan()); attachEvents();
  alert(r.message);
}

/* ---- inventaris ---- */
async function submitInventaris() {
  const btn = document.getElementById("btnSimpanInventaris");
  const existing = btn.dataset.existing === "1";
  const payload = {
    nama_barang: document.getElementById("fNama").value.trim(),
    kategori: document.getElementById("fKategori").value,
    jumlah: document.getElementById("fJumlah").value,
    kondisi: document.getElementById("fKondisi").value,
    lokasi: document.getElementById("fLokasi").value.trim(),
    catatan: document.getElementById("fCatatan").value.trim()
  };
  if (!payload.nama_barang) { formError = "Nama barang wajib diisi."; setScreen(inventarisForm(existing ? payload : null)); attachEvents(); return; }
  if (existing) payload.id = btn.dataset.id;
  btn.disabled = true; btn.textContent = "Menyimpan…";
  const r = await apiPost(existing ? "updateInventaris" : "addInventaris", payload);
  if (!r.ok) { formError = r.error; setScreen(inventarisForm(existing ? payload : null)); attachEvents(); return; }
  formError = "";
  currentTab = "inventaris";
  await refreshInventaris(); setScreen(screens.inventaris()); attachEvents();
}
async function delInventaris(id) {
  if (!confirm("Hapus barang ini dari inventaris?")) return;
  const r = await apiPost("deleteInventaris", { id });
  if (!r.ok) { alert(r.error); return; }
  await refreshInventaris(); setScreen(screens.inventaris()); attachEvents();
}

// Perbarui nama & peran dari server (mis. peran diubah Admin) tanpa perlu login ulang.
async function sinkronSesi() {
  if (!session || !session.username) return;
  try {
    const r = await apiGet("cekSesi");
    if (!(r && r.ok && r.user) || !session) return;
    if (r.user.peran !== session.peran || r.user.nama !== session.nama) {
      session.peran = r.user.peran; session.nama = r.user.nama; touchSesi(true);
      currentTab = session.peran === "admin" ? "akun" : "beranda";
      render(); loadAndShow(currentTab);
    }
  } catch (e) {}
}
if (sesiPesan) formError = sesiPesan;
if (session && session.peran === "admin") currentTab = "akun";
render();
if (session) { loadAndShow(currentTab); sinkronSesi(); }
